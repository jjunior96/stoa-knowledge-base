<svg xmlns="http://www.w3.org/2000/svg" width="178" height="28" viewBox="0 0 178 28" role="img" aria-label="Explore the catalogue">
  <title>Explore the catalogue</title>
  <!--
    The one call to action at the top of the README, pointing at Stoa's catalogue
    page. It is drawn from the same parts as add-to-stoa.svg — dark canvas, S
    monolith, lens ring stroked at 5 — so the two read as one family, but its
    border is the brand purple at full strength: add-to-stoa repeats on every
    row and stays quiet, this appears once and should not.

    textLength pins the label to its box whatever font GitHub falls back to, and
    lengthAdjust="spacing" absorbs the difference in letter spacing rather than
    squashing glyphs.
  -->
  <rect x="0.75" y="0.75" width="176.5" height="26.5" rx="6" fill="#1B2136" stroke="#9466FF" stroke-width="1.5" />

  <g transform="translate(6.13, 3.81) scale(0.17)">
    <path
      d="M 90 26 H 50 A 17 17 0 0 0 33 43 A 17 17 0 0 0 50 60 H 70 A 17 17 0 0 1 87 77 A 17 17 0 0 1 70 94 H 30"
      fill="none"
      stroke="#9466FF"
      stroke-width="38"
      stroke-linecap="round"
    />
    <circle cx="60" cy="60" r="26" fill="#1B2136" />
    <circle cx="60" cy="60" r="14" fill="none" stroke="#9466FF" stroke-width="5" />
  </g>

  <text
    x="32"
    y="18.5"
    font-size="12"
    font-weight="600"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    fill="#E1E4EC"
    textLength="134"
    lengthAdjust="spacing"
  >Explore the catalogue</text>
</svg>
