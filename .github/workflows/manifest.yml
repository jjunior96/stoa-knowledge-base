name: Manifest

# The manifest is the catalogue's allowlist, so it must never lag behind the
# decks. Rebuilding it here means a contributor only ever adds a CSV — and a
# deck can never be published without an entry, or an entry outlive its file.
on:
  pull_request:
    paths:
      - 'subjects/**'
      - 'scripts/build-manifest.mjs'
      - '.github/workflows/manifest.yml'
  push:
    branches: [main]
    paths:
      - 'subjects/**'
      - 'scripts/build-manifest.mjs'

permissions:
  contents: write

concurrency:
  group: manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch this run is for
        uses: actions/checkout@v4
        with:
          # A pull_request run checks out a merge commit by default, which
          # cannot be pushed back to. Name the head branch explicitly.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # The manifest records when each deck last changed, which is read from
          # the commit history — a shallow clone would report it as unknown.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild the manifest
        run: node scripts/build-manifest.mjs

      - name: Report whether it changed
        id: diff
        run: |
          if git diff --quiet -- manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "manifest.json was already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- manifest.json
          fi

      # A fork's branch is not writable with this token, so the commit has to
      # come from the contributor. Failing loudly beats merging a stale manifest.
      - name: Ask a fork contributor to commit it
        if: >-
          steps.diff.outputs.changed == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::manifest.json is out of date and this pull request comes from a fork, so it cannot be updated for you. Run 'node scripts/build-manifest.mjs' and commit the result."
          exit 1

      - name: Commit the rebuilt manifest
        if: >-
          steps.diff.outputs.changed == 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore(manifest): rebuild from subjects/"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
